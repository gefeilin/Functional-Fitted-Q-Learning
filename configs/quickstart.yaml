# Small CPU example; not the paper-scale experiment configuration.
master_seed: 200000
evaluation_seed: 200001
n_subjects: 10
t_per_subject: 3
ode_substeps: 8
action_grid_points: 16
fqi_iterations: 2
policy_basis_dimension: 4
policy_coefficient: 0.001
critic:
  n_basis_nodes: 2
  micro_hidden_layers: [4]
  outer_hidden_layers: [8]
  batch_size: 16
  max_epochs: 4
  early_stopping_patience: 2
  require_early_stopping_convergence: false
policy:
  restarts: 1
  max_objective_evals: 8
  population_size: 4
  objective_state_count: 8
  candidate_batch_size: 2
evaluation:
  episodes: 8
  horizon: 10
