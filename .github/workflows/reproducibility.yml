name: Reproducibility

on:
  push:
    branches: [main, theory]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  analysis:
    name: Figures and notebook (CPU, no PyTorch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-analysis.lock.txt
      - name: Install the analysis environment
        run: |
          python -m pip install -r requirements-analysis.lock.txt
          python -m pip install --no-deps -e .
          python -m pip check
          python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
      - name: Reproduce and check the supplied results
        run: make check
      - name: Keep the supplied examples and results unchanged
        run: git diff --exit-code

  training:
    name: Small training and resume (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-analysis.lock.txt
            pyproject.toml
      - name: Install the CPU training environment
        run: |
          python -m pip install -r requirements-analysis.lock.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Run all unit tests
        run: make test
      - name: Run the README training example
        run: make quickstart
      - name: Check both critics and interrupted resume
        run: make smoke
      - name: Keep the supplied examples and results unchanged
        run: git diff --exit-code
